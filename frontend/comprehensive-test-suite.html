<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Comprehensive Test Suite - Bezpieczny Pomocnik</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        
        .test-section {
            background: #252526;
            border-left: 4px solid #4CAF50;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        .test-section.running {
            border-left-color: #2196F3;
        }
        
        .test-section.failed {
            border-left-color: #f44336;
        }
        
        .section-title {
            font-size: 20px;
            color: #4CAF50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .test-case {
            background: #1e1e1e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            border-left: 3px solid #333;
        }
        
        .test-case.pass {
            border-left-color: #4CAF50;
        }
        
        .test-case.fail {
            border-left-color: #f44336;
        }
        
        .test-case.running {
            border-left-color: #2196F3;
        }
        
        .test-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .test-result {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .pass { color: #4CAF50; }
        .fail { color: #f44336; }
        .warning { color: #FF9800; }
        .info { color: #2196F3; }
        
        .summary {
            background: #252526;
            padding: 20px;
            margin: 30px 0;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #888;
            font-size: 14px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            margin: 10px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Comprehensive Test Suite</h1>
        <p class="subtitle">Bezpieczny Pomocnik - Automated Testing Framework</p>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        
        <div class="summary">
            <div class="stat">
                <div class="stat-value pass" id="passCount">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat">
                <div class="stat-value fail" id="failCount">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat">
                <div class="stat-value warning" id="warningCount">0</div>
                <div class="stat-label">Warnings</div>
            </div>
            <div class="stat">
                <div class="stat-value info" id="totalCount">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="runAllTests()" id="runBtn">▶️ Uruchom wszystkie testy</button>
            <button onclick="runStage1()" id="stage1Btn">1️⃣ ETAP 1: KRYTYCZNE</button>
            <button onclick="runStage2()" id="stage2Btn">2️⃣ ETAP 2: CORE</button>
            <button onclick="runStage3()" id="stage3Btn">3️⃣ ETAP 3: ADVANCED</button>
            <button onclick="runStage4()" id="stage4Btn">4️⃣ ETAP 4: POLISH</button>
            <button onclick="exportResults()">💾 Eksportuj raport</button>
        </div>
        
        <div id="results"></div>
    </div>

    <!-- Load required modules -->
    <script src="mina-parental-zk.js"></script>
    <script src="enhanced-security-zk.js"></script>
    <script src="parent-cms.js"></script>
    <script src="child-session-manager.js"></script>
    
    <script>
        // Test framework
        const testResults = {
            pass: 0,
            fail: 0,
            warning: 0,
            total: 0,
            details: []
        };
        
        function updateStats() {
            document.getElementById('passCount').textContent = testResults.pass;
            document.getElementById('failCount').textContent = testResults.fail;
            document.getElementById('warningCount').textContent = testResults.warning;
            document.getElementById('totalCount').textContent = testResults.total;
            
            const progress = (testResults.total > 0) 
                ? ((testResults.pass + testResults.fail) / testResults.total) * 100 
                : 0;
            document.getElementById('progress').style.width = progress + '%';
        }
        
        function createTestSection(title, emoji) {
            const section = document.createElement('div');
            section.className = 'test-section';
            section.innerHTML = `<div class="section-title">${emoji} ${title}</div>`;
            document.getElementById('results').appendChild(section);
            return section;
        }
        
        function addTestCase(section, name, result, details) {
            testResults.total++;
            
            const testCase = document.createElement('div');
            testCase.className = 'test-case ' + result;
            
            let resultClass = result;
            let resultEmoji = '❓';
            
            if (result === 'pass') {
                testResults.pass++;
                resultEmoji = '✅';
            } else if (result === 'fail') {
                testResults.fail++;
                resultEmoji = '❌';
            } else if (result === 'warning') {
                testResults.warning++;
                resultEmoji = '⚠️';
            }
            
            testCase.innerHTML = `
                <div class="test-name">${resultEmoji} ${name}</div>
                <div class="test-result ${resultClass}">${details}</div>
            `;
            
            section.appendChild(testCase);
            updateStats();
            
            testResults.details.push({
                name,
                result,
                details,
                timestamp: new Date().toISOString()
            });
        }
        
        // ========================================
        // ETAP 1: KRYTYCZNE (RODO & Security)
        // ========================================
        
        async function runStage1() {
            console.log('🧪 Starting STAGE 1: CRITICAL TESTS');
            document.getElementById('results').innerHTML = '';
            testResults.pass = 0;
            testResults.fail = 0;
            testResults.warning = 0;
            testResults.total = 0;
            testResults.details = [];
            
            // Test 1.1: RODO Parental Consent
            const section1 = createTestSection('Test 1.1: RODO Art. 8 - Parental Consent', '🔒');
            
            // Check if ZKParentalConsent exists
            if (typeof window.ZKParentalConsent !== 'undefined') {
                addTestCase(section1, 'ZKParentalConsent loaded', 'pass', 
                    'window.ZKParentalConsent is available');
            } else {
                addTestCase(section1, 'ZKParentalConsent loaded', 'fail', 
                    'window.ZKParentalConsent is undefined!');
            }
            
            // Check if consent is properly stored
            const consentData = localStorage.getItem('zk_parental_consent');
            if (consentData) {
                try {
                    const parsed = JSON.parse(consentData);
                    if (parsed.consent && parsed.childAge) {
                        addTestCase(section1, 'Parental consent data valid', 'pass', 
                            `Consent: ${parsed.consent}, Child age: ${parsed.childAge}`);
                    } else {
                        addTestCase(section1, 'Parental consent data valid', 'fail', 
                            'Consent data missing required fields');
                    }
                } catch (e) {
                    addTestCase(section1, 'Parental consent data valid', 'fail', 
                        `Failed to parse consent data: ${e.message}`);
                }
            } else {
                addTestCase(section1, 'Parental consent data valid', 'warning', 
                    'No parental consent found - user may not have granted it yet');
            }
            
            // Test 1.2: Mina ZK Storage
            const section2 = createTestSection('Test 1.2: Mina ZK Storage Security', '🛡️');
            
            // Check all localStorage keys
            const allKeys = Object.keys(localStorage);
            const zkKeys = allKeys.filter(k => k.startsWith('zk_'));
            const nonZkKeys = allKeys.filter(k => !k.startsWith('zk_') && 
                                                    !k.startsWith('ally-') &&
                                                    !k.startsWith('loglevel'));
            
            addTestCase(section2, 'ZK-prefixed keys count', 'info', 
                `Found ${zkKeys.length} ZK keys: ${zkKeys.slice(0, 5).join(', ')}${zkKeys.length > 5 ? '...' : ''}`);
            
            if (nonZkKeys.length === 0) {
                addTestCase(section2, 'No non-ZK sensitive data', 'pass', 
                    'All user data uses zk_ prefix for privacy');
            } else {
                addTestCase(section2, 'No non-ZK sensitive data', 'warning', 
                    `Found ${nonZkKeys.length} non-ZK keys: ${nonZkKeys.join(', ')}`);
            }
            
            // Check parent identifier
            const parentId = localStorage.getItem('zk_parent_identifier');
            if (parentId && parentId.startsWith('parent_')) {
                addTestCase(section2, 'Parent identifier format', 'pass', 
                    `Valid format: ${parentId}`);
            } else {
                addTestCase(section2, 'Parent identifier format', 'fail', 
                    `Invalid or missing parent identifier: ${parentId}`);
            }
            
            // Test 1.3: Enhanced Security ZK
            const section3 = createTestSection('Test 1.3: Enhanced Security System', '🔐');
            
            if (typeof window.EnhancedSecurityZK !== 'undefined') {
                addTestCase(section3, 'EnhancedSecurityZK loaded', 'pass', 
                    'Enhanced security module available');
                    
                // Try to get storage info
                try {
                    const storageInfo = await window.EnhancedSecurityZK.getStorageInfo();
                    addTestCase(section3, 'Security storage info', 'pass', 
                        `Security: ${storageInfo.securityLevel}, Type: ${storageInfo.storageType}, Entries: ${storageInfo.totalEntries}`);
                } catch (e) {
                    addTestCase(section3, 'Security storage info', 'warning', 
                        `Could not get storage info: ${e.message}`);
                }
            } else {
                addTestCase(section3, 'EnhancedSecurityZK loaded', 'fail', 
                    'window.EnhancedSecurityZK not available');
            }
            
            // Test 1.4: Parent CMS Integration
            const section4 = createTestSection('Test 1.4: Parent CMS Basic Functionality', '👨‍👩‍👧');
            
            if (typeof window.loadFromMinaZK === 'function') {
                addTestCase(section4, 'loadFromMinaZK available', 'pass', 
                    'Parent CMS read function exists');
            } else {
                addTestCase(section4, 'loadFromMinaZK available', 'fail', 
                    'loadFromMinaZK function not found');
            }
            
            if (typeof window.saveToMinaZK === 'function') {
                addTestCase(section4, 'saveToMinaZK available', 'pass', 
                    'Parent CMS write function exists');
            } else {
                addTestCase(section4, 'saveToMinaZK available', 'fail', 
                    'saveToMinaZK function not found');
            }
            
            // Try to load safety tips
            try {
                const safetyTips = await window.loadFromMinaZK('zk_parent_safety_tips');
                if (safetyTips && Array.isArray(safetyTips)) {
                    addTestCase(section4, 'Load safety tips from CMS', 'pass', 
                        `Loaded ${safetyTips.length} safety tips successfully`);
                } else {
                    addTestCase(section4, 'Load safety tips from CMS', 'warning', 
                        'No safety tips found (parent may not have created any)');
                }
            } catch (e) {
                addTestCase(section4, 'Load safety tips from CMS', 'fail', 
                    `Failed to load safety tips: ${e.message}`);
            }
            
            console.log('✅ STAGE 1 completed');
            return testResults;
        }
        
        // ========================================
        // ETAP 2: CORE FUNCTIONALITY
        // ========================================
        
        async function runStage2() {
            console.log('🧪 Starting STAGE 2: CORE FUNCTIONALITY');
            
            // Test 2.1: Safety Tips System
            const section1 = createTestSection('Test 2.1: Safety Tips Display & Speech', '💡');
            
            // Check if safety tips container exists
            const tipsContainer = document.querySelector('.safety-tips');
            if (tipsContainer) {
                addTestCase(section1, 'Safety tips container exists', 'pass', 
                    'Found .safety-tips container in DOM');
            } else {
                addTestCase(section1, 'Safety tips container exists', 'warning', 
                    'Safety tips container not found (might be on different page)');
            }
            
            // Test 2.2: Multi-Child Support
            const section2 = createTestSection('Test 2.2: Multi-Child Session Management', '👶');
            
            if (typeof window.childSessionManager !== 'undefined') {
                addTestCase(section2, 'Child Session Manager loaded', 'pass', 
                    'childSessionManager module available');
                    
                try {
                    const currentChildId = await window.childSessionManager.getCurrentChildId();
                    if (currentChildId) {
                        addTestCase(section2, 'Current child session', 'pass', 
                            `Active child: ${currentChildId}`);
                    } else {
                        addTestCase(section2, 'Current child session', 'warning', 
                            'No active child session');
                    }
                } catch (e) {
                    addTestCase(section2, 'Current child session', 'fail', 
                        `Error getting child session: ${e.message}`);
                }
            } else {
                addTestCase(section2, 'Child Session Manager loaded', 'fail', 
                    'childSessionManager not available');
            }
            
            // Load child profiles
            try {
                const profiles = await window.loadFromMinaZK('zk_family_children_profiles');
                if (profiles && Array.isArray(profiles)) {
                    addTestCase(section2, 'Child profiles loaded', 'pass', 
                        `Found ${profiles.length} child profile(s)`);
                } else {
                    addTestCase(section2, 'Child profiles loaded', 'warning', 
                        'No child profiles found');
                }
            } catch (e) {
                addTestCase(section2, 'Child profiles loaded', 'fail', 
                    `Error loading profiles: ${e.message}`);
            }
            
            console.log('✅ STAGE 2 completed');
        }
        
        // ========================================
        // ETAP 3: ADVANCED (PWA, Alerts, Emergency)
        // ========================================
        
        async function runStage3() {
            console.log('🧪 Starting STAGE 3: ADVANCED TESTS');
            
            // Test 3.1: Service Worker & PWA
            const section1 = createTestSection('Test 3.1: Service Worker & PWA', '💾');
            
            if ('serviceWorker' in navigator) {
                addTestCase(section1, 'Service Worker API available', 'pass', 
                    'Browser supports Service Workers');
                    
                try {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        addTestCase(section1, 'Service Worker registered', 'pass', 
                            `SW active: ${registration.active ? 'Yes' : 'No'}, Scope: ${registration.scope}`);
                    } else {
                        addTestCase(section1, 'Service Worker registered', 'warning', 
                            'No Service Worker registered yet');
                    }
                } catch (e) {
                    addTestCase(section1, 'Service Worker registered', 'fail', 
                        `Error checking SW: ${e.message}`);
                }
            } else {
                addTestCase(section1, 'Service Worker API available', 'fail', 
                    'Browser does not support Service Workers');
            }
            
            // Check Cache API
            if ('caches' in window) {
                addTestCase(section1, 'Cache API available', 'pass', 
                    'Browser supports Cache API');
                    
                try {
                    const cacheNames = await caches.keys();
                    if (cacheNames.length > 0) {
                        addTestCase(section1, 'Emergency cache exists', 'pass', 
                            `Found ${cacheNames.length} cache(s): ${cacheNames.join(', ')}`);
                    } else {
                        addTestCase(section1, 'Emergency cache exists', 'warning', 
                            'No caches found - may not be initialized yet');
                    }
                } catch (e) {
                    addTestCase(section1, 'Emergency cache exists', 'fail', 
                        `Error checking caches: ${e.message}`);
                }
            } else {
                addTestCase(section1, 'Cache API available', 'fail', 
                    'Browser does not support Cache API');
            }
            
            // Test 3.2: Alert System Components
            const section2 = createTestSection('Test 3.2: Alert System', '🚨');
            
            // Check for alert-related functions
            const alertFunctions = [
                'checkForAlerts',
                'startAlertMonitoring',
                'handleLocationError'
            ];
            
            alertFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    addTestCase(section2, `${funcName} function exists`, 'pass', 
                        `Alert function available: ${funcName}()`);
                } else {
                    addTestCase(section2, `${funcName} function exists`, 'warning', 
                        `Function not found in global scope (may be in app.js context)`);
                }
            });
            
            // Test 3.3: Emergency Mode
            const section3 = createTestSection('Test 3.3: Emergency Mode Configuration', '⚡');
            
            // Check for emergency-related localStorage
            const emergencyKeys = Object.keys(localStorage).filter(k => 
                k.includes('emergency') || k.includes('crisis'));
            
            if (emergencyKeys.length > 0) {
                addTestCase(section3, 'Emergency data stored', 'pass', 
                    `Found ${emergencyKeys.length} emergency key(s): ${emergencyKeys.join(', ')}`);
            } else {
                addTestCase(section3, 'Emergency data stored', 'info', 
                    'No emergency-specific data (normal for non-crisis mode)');
            }
            
            // Check battery API (for emergency optimization)
            if ('getBattery' in navigator) {
                addTestCase(section3, 'Battery API available', 'pass', 
                    'Can monitor battery for emergency optimization');
                    
                try {
                    const battery = await navigator.getBattery();
                    const batteryInfo = `Level: ${(battery.level * 100).toFixed(0)}%, Charging: ${battery.charging}`;
                    addTestCase(section3, 'Battery status', 'info', batteryInfo);
                } catch (e) {
                    addTestCase(section3, 'Battery status', 'warning', 
                        `Could not get battery status: ${e.message}`);
                }
            } else {
                addTestCase(section3, 'Battery API available', 'warning', 
                    'Battery API not supported (emergency optimization limited)');
            }
            
            console.log('✅ STAGE 3 completed');
        }
        
        // ========================================
        // ETAP 4: POLISH (UX, Accessibility)
        // ========================================
        
        async function runStage4() {
            console.log('🧪 Starting STAGE 4: POLISH TESTS');
            
            // Test 4.1: Browser Capabilities
            const section1 = createTestSection('Test 4.1: Browser Compatibility', '🌐');
            
            // Check Speech Synthesis
            if ('speechSynthesis' in window) {
                addTestCase(section1, 'Speech Synthesis API', 'pass', 
                    'Text-to-speech available');
                    
                const voices = speechSynthesis.getVoices();
                const polishVoices = voices.filter(v => v.lang.includes('pl'));
                
                if (polishVoices.length > 0) {
                    addTestCase(section1, 'Polish voices available', 'pass', 
                        `Found ${polishVoices.length} Polish voice(s): ${polishVoices.map(v => v.name).slice(0, 3).join(', ')}`);
                } else {
                    addTestCase(section1, 'Polish voices available', 'warning', 
                        'No Polish voices found - may load after page load');
                }
            } else {
                addTestCase(section1, 'Speech Synthesis API', 'fail', 
                    'Speech synthesis not supported');
            }
            
            // Check Geolocation
            if ('geolocation' in navigator) {
                addTestCase(section1, 'Geolocation API', 'pass', 
                    'Location services available');
            } else {
                addTestCase(section1, 'Geolocation API', 'fail', 
                    'Geolocation not supported');
            }
            
            // Check Notification API
            if ('Notification' in window) {
                addTestCase(section1, 'Notification API', 'pass', 
                    `Notifications available (Permission: ${Notification.permission})`);
            } else {
                addTestCase(section1, 'Notification API', 'warning', 
                    'Notifications not supported');
            }
            
            // Test 4.2: Performance & Storage
            const section2 = createTestSection('Test 4.2: Performance & Storage', '⚡');
            
            // Check localStorage usage
            let localStorageSize = 0;
            for (let key in localStorage) {
                if (localStorage.hasOwnProperty(key)) {
                    localStorageSize += localStorage[key].length + key.length;
                }
            }
            const sizeMB = (localStorageSize / 1024 / 1024).toFixed(2);
            
            if (localStorageSize < 5 * 1024 * 1024) { // < 5MB
                addTestCase(section2, 'localStorage usage', 'pass', 
                    `Using ${sizeMB} MB of localStorage (efficient)`);
            } else {
                addTestCase(section2, 'localStorage usage', 'warning', 
                    `Using ${sizeMB} MB of localStorage (consider cleanup)`);
            }
            
            // Check IndexedDB support
            if ('indexedDB' in window) {
                addTestCase(section2, 'IndexedDB available', 'pass', 
                    'IndexedDB for advanced storage available');
            } else {
                addTestCase(section2, 'IndexedDB available', 'warning', 
                    'IndexedDB not supported');
            }
            
            // Test 4.3: Security Headers & Context
            const section3 = createTestSection('Test 4.3: Security Context', '🔐');
            
            // Check HTTPS
            if (location.protocol === 'https:' || location.hostname === 'localhost') {
                addTestCase(section3, 'Secure context', 'pass', 
                    `Running in secure context: ${location.protocol}`);
            } else {
                addTestCase(section3, 'Secure context', 'fail', 
                    'Not running in secure context (HTTPS required for production)');
            }
            
            // Check console for errors
            const hasConsoleErrors = false; // We can't programmatically check this easily
            addTestCase(section3, 'Console error check', 'info', 
                'Check browser console manually for any errors');
            
            console.log('✅ STAGE 4 completed');
        }
        
        // ========================================
        // RUN ALL TESTS
        // ========================================
        
        async function runAllTests() {
            console.log('🚀 Starting comprehensive test suite...');
            document.getElementById('runBtn').disabled = true;
            
            await runStage1();
            await runStage2();
            await runStage3();
            await runStage4();
            
            document.getElementById('runBtn').disabled = false;
            console.log('🎉 All tests completed!');
        }
        
        // Export results
        function exportResults() {
            const report = {
                timestamp: new Date().toISOString(),
                summary: {
                    total: testResults.total,
                    passed: testResults.pass,
                    failed: testResults.fail,
                    warnings: testResults.warning,
                    successRate: ((testResults.pass / testResults.total) * 100).toFixed(2) + '%'
                },
                tests: testResults.details
            };
            
            const blob = new Blob([JSON.stringify(report, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-report-${Date.now()}.json`;
            a.click();
            
            console.log('📄 Test report exported');
        }
        
        // Auto-info on load
        window.addEventListener('load', () => {
            console.log('🧪 Comprehensive Test Suite loaded');
            console.log('Click "▶️ Uruchom wszystkie testy" or choose a specific stage');
        });
    </script>
</body>
</html>
