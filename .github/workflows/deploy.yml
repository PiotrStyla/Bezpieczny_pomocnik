name: 🚀 Deploy Emergency Safety App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3
      
    - name: 🛡️ Setup Emergency Environment
      run: |
        echo "🚨 Deploying emergency-ready safety app"
        echo "⚔️ Times are not safe - blockchain privacy protection active"
        
    - name: 🌍 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend
        cname: bezpieczny-pomocnik.github.io
        
    - name: ✅ Deployment Complete
      run: |
        echo "🚨 Emergency safety system deployed!"
        echo "🛡️ Multilingual crisis communications: Polish/English/Ukrainian"
        echo "👶 Age-appropriate messaging: Young (6-10) / Older (11-16)"
        echo "⚡ 22KB blockchain sync ready for war-time scenarios"
        echo "🌍 Production URL: https://${{ github.repository_owner }}.github.io/Bezpieczny_pomocnik/"
