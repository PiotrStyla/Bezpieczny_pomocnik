<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Force Service Worker Update</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        button {
            background: #f44336;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
            width: 100%;
        }
        button:hover {
            background: #d32f2f;
        }
        .success {
            background: #4CAF50;
        }
        .success:hover {
            background: #45a049;
        }
        #status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: #f5f5f5;
        }
        .step {
            margin: 10px 0;
            padding: 10px;
            border-left: 4px solid #2196F3;
            background: #e3f2fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Force Service Worker Update</h1>
        <p>Ten tool wyczyści cache i wymusi aktualizację Service Workera.</p>
        
        <div id="status">
            <h3>Status:</h3>
            <div id="statusText">Gotowy do czyszczenia...</div>
        </div>
        
        <button onclick="forceUpdate()">🗑️ WYCZYŚĆ WSZYSTKO I ZAKTUALIZUJ</button>
        <button onclick="checkStatus()" class="success">📊 Sprawdź status</button>
        <button onclick="goToParentCMS()" class="success">➡️ Przejdź do Parent CMS</button>
        
        <div style="margin-top: 30px; padding: 20px; background: #fff3cd; border-left: 4px solid #ffc107; border-radius: 8px;">
            <h3>📋 Instrukcja:</h3>
            <div class="step">
                <strong>Krok 1:</strong> Kliknij "WYCZYŚĆ WSZYSTKO"
            </div>
            <div class="step">
                <strong>Krok 2:</strong> Poczekaj na potwierdzenie
            </div>
            <div class="step">
                <strong>Krok 3:</strong> Kliknij "Przejdź do Parent CMS"
            </div>
            <div class="step">
                <strong>Krok 4:</strong> Przetestuj adres domowy
            </div>
        </div>
    </div>
    
    <script>
        function log(message, color = '#333') {
            const statusDiv = document.getElementById('statusText');
            const timestamp = new Date().toLocaleTimeString();
            statusDiv.innerHTML += `<div style="color: ${color}; margin: 5px 0;">[${timestamp}] ${message}</div>`;
        }
        
        async function forceUpdate() {
            document.getElementById('statusText').innerHTML = '';
            log('🚀 Rozpoczynam czyszczenie...', '#2196F3');
            
            try {
                // 1. Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`📋 Znaleziono ${registrations.length} Service Workerów`, '#FF9800');
                    
                    for (let registration of registrations) {
                        await registration.unregister();
                        log('✅ Service Worker odrejestrowany', '#4CAF50');
                    }
                }
                
                // 2. Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    log(`📦 Znaleziono ${cacheNames.length} cache'y`, '#FF9800');
                    
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        log(`✅ Usunięto cache: ${cacheName}`, '#4CAF50');
                    }
                }
                
                // 3. Clear localStorage
                localStorage.clear();
                log('✅ localStorage wyczyszczony', '#4CAF50');
                
                // 4. Clear sessionStorage
                sessionStorage.clear();
                log('✅ sessionStorage wyczyszczony', '#4CAF50');
                
                log('', '#333');
                log('🎉 WSZYSTKO WYCZYSZCZONE!', '#4CAF50');
                log('', '#333');
                log('⚠️ Teraz kliknij "Przejdź do Parent CMS"', '#f44336');
                
            } catch (error) {
                log(`❌ Błąd: ${error.message}`, '#f44336');
            }
        }
        
        async function checkStatus() {
            document.getElementById('statusText').innerHTML = '';
            log('🔍 Sprawdzam status...', '#2196F3');
            
            // Check Service Workers
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                if (registrations.length === 0) {
                    log('✅ Brak Service Workerów (dobrze!)', '#4CAF50');
                } else {
                    log(`⚠️ Znaleziono ${registrations.length} Service Workerów`, '#FF9800');
                }
            }
            
            // Check caches
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                if (cacheNames.length === 0) {
                    log('✅ Brak cache (dobrze!)', '#4CAF50');
                } else {
                    log(`⚠️ Znaleziono ${cacheNames.length} cache'y: ${cacheNames.join(', ')}`, '#FF9800');
                }
            }
            
            // Check localStorage
            const lsKeys = Object.keys(localStorage);
            if (lsKeys.length === 0) {
                log('✅ localStorage pusty (dobrze!)', '#4CAF50');
            } else {
                log(`⚠️ localStorage ma ${lsKeys.length} kluczy`, '#FF9800');
            }
        }
        
        function goToParentCMS() {
            log('➡️ Przekierowuję do Parent CMS...', '#2196F3');
            setTimeout(() => {
                window.location.href = './parent-cms.html';
            }, 500);
        }
        
        // Auto-check on load
        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
